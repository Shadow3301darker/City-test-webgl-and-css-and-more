<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>WebGL Neon City — Touch Edition</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#010208;touch-action:none}
body{font-family:monospace}
canvas{display:block;width:100vw;height:100vh}
#hud{position:fixed;inset:0;pointer-events:none;color:#8befff}
.top{position:absolute;left:3vw;top:3vh;letter-spacing:.18em;font-size:10px;text-shadow:0 0 12px #38dfff}
h1{margin:.55rem 0;font:700 clamp(34px,6vw,82px)/.8 system-ui;color:#effcff;letter-spacing:-.06em}
h1 span{color:transparent;-webkit-text-stroke:1px rgba(110,238,255,.6)}
.bottom{position:absolute;left:3vw;bottom:3vh;color:#6e8199;font-size:9px;letter-spacing:.12em}
#error{position:absolute;left:3vw;top:42%;max-width:70vw;color:#ff668e;font-size:11px;white-space:pre-wrap}
.reticle{position:absolute;left:50%;top:50%;width:34px;height:34px;transform:translate(-50%,-50%);border:1px solid rgba(112,235,255,.22);box-shadow:0 0 22px rgba(70,220,255,.08)}
.reticle:before,.reticle:after{content:"";position:absolute;background:#7cefff}
.reticle:before{left:50%;top:-9px;width:1px;height:52px}.reticle:after{top:50%;left:-9px;height:1px;width:52px}

/* Touch controls */
#controls{position:fixed;inset:0;pointer-events:none}
.pad{position:absolute;bottom:5vh;width:145px;height:145px;border:1px solid rgba(110,235,255,.16);border-radius:50%;background:radial-gradient(circle,rgba(80,210,255,.09),rgba(0,0,0,.05) 65%,transparent 66%);pointer-events:auto}
#move{left:5vw}
#look{right:5vw}
.knob{position:absolute;left:50%;top:50%;width:58px;height:58px;transform:translate(-50%,-50%);border-radius:50%;border:1px solid rgba(112,240,255,.45);background:radial-gradient(circle,rgba(90,230,255,.25),rgba(30,90,120,.08));box-shadow:0 0 25px rgba(60,220,255,.15);pointer-events:none}
.padLabel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:7px;letter-spacing:.18em;color:#60879b;pointer-events:none}
@media (min-width:900px){.pad{width:125px;height:125px}.knob{width:52px;height:52px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="top">PROJECT VEIL // WEBGL CITY STUDY
    <h1>NEON<br><span>SECTOR 07</span></h1>
  </div>
  <div class="bottom"><span id="stats">BOOTING WEBGL2 // TOUCH READY</span></div>
  <div class="reticle"></div>
</div>
<div id="error"></div>
<div id="controls">
  <div class="pad" id="move"><div class="knob"></div><div class="padLabel">MOVE</div></div>
  <div class="pad" id="look"><div class="knob"></div><div class="padLabel">LOOK</div></div>
</div>

<script>
const canvas=document.getElementById("c");
const errorBox=document.getElementById("error");
const gl=canvas.getContext("webgl2",{antialias:true,alpha:false,powerPreference:"high-performance"});

if(!gl){
  errorBox.textContent="WEBGL2 COULD NOT INITIALIZE.\\nTrying WebGL fallback...";
}

if(gl){
const VS=`#version 300 es
in vec3 p; in vec3 n; in vec3 col;
uniform mat4 mvp,model;
out vec3 vN,vC,vP;
void main(){
  vN=mat3(model)*n; vC=col; vP=(model*vec4(p,1.0)).xyz;
  gl_Position=mvp*vec4(p,1.0);
}`;
const FS=`#version 300 es
precision highp float;
in vec3 vN,vC,vP;
uniform vec3 lightPos;
out vec4 outColor;
void main(){
  vec3 N=normalize(vN);
  vec3 L=normalize(lightPos-vP);
  float d=max(dot(N,L),0.0);
  float rim=pow(1.0-max(dot(N,normalize(vec3(0.0,0.0,1.0))),0.0),3.0);
  vec3 base=vC*(.20+.80*d)+vC*rim*.35;
  outColor=vec4(base,1.0);
}`;
function makeShader(type,src){
  const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const prog=gl.createProgram();
gl.attachShader(prog,makeShader(gl.VERTEX_SHADER,VS));
gl.attachShader(prog,makeShader(gl.FRAGMENT_SHADER,FS));
gl.linkProgram(prog);
if(!gl.getProgramParameter(prog,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);

const loc={
 p:gl.getAttribLocation(prog,"p"), n:gl.getAttribLocation(prog,"n"), col:gl.getAttribLocation(prog,"col"),
 mvp:gl.getUniformLocation(prog,"mvp"), model:gl.getUniformLocation(prog,"model"),
 lightPos:gl.getUniformLocation(prog,"lightPos")
};

function I(){const a=new Float32Array(16);a[0]=a[5]=a[10]=a[15]=1;return a}
function mul(a,b){
 const o=new Float32Array(16);
 for(let c=0;c<4;c++)for(let r=0;r<4;r++)
   o[c*4+r]=a[r]*b[c*4]+a[4+r]*b[c*4+1]+a[8+r]*b[c*4+2]+a[12+r]*b[c*4+3];
 return o;
}
function persp(fov,asp,n,f){
 const o=new Float32Array(16),t=1/Math.tan(fov/2);
 o[0]=t/asp;o[5]=t;o[10]=(f+n)/(n-f);o[11]=-1;o[14]=2*f*n/(n-f);return o;
}
function lookAt(e,c,u){
 let z=[e[0]-c[0],e[1]-c[1],e[2]-c[2]],zl=Math.hypot(...z);z=z.map(v=>v/zl);
 let x=[u[1]*z[2]-u[2]*z[1],u[2]*z[0]-u[0]*z[2],u[0]*z[1]-u[1]*z[0]],xl=Math.hypot(...x);x=x.map(v=>v/xl);
 let y=[z[1]*x[2]-z[2]*x[1],z[2]*x[0]-z[0]*x[2],z[0]*x[1]-z[1]*x[0]];
 const o=I();o[0]=x[0];o[1]=y[0];o[2]=z[0];o[4]=x[1];o[5]=y[1];o[6]=z[1];o[8]=x[2];o[9]=y[2];o[10]=z[2];
 o[12]=-(x[0]*e[0]+x[1]*e[1]+x[2]*e[2]);o[13]=-(y[0]*e[0]+y[1]*e[1]+y[2]*e[2]);o[14]=-(z[0]*e[0]+z[1]*e[1]+z[2]*e[2]);
 return o;
}

let V=[],N=[],C=[],IDX=[];
function quad(P,n,c){
 const b=V.length/3;
 for(const p of P){V.push(...p);N.push(...n);C.push(...c)}
 IDX.push(b,b+1,b+2,b,b+2,b+3);
}
function box(x,y,z,w,h,d,c){
 quad([[x,y,z],[x+w,y,z],[x+w,y+h,z],[x,y+h,z]],[0,0,-1],c);
 quad([[x+w,y,z+d],[x,y,z+d],[x,y+h,z+d],[x+w,y+h,z+d]],[0,0,1],c);
 quad([[x+w,y,z],[x+w,y,z+d],[x+w,y+h,z+d],[x+w,y+h,z]],[1,0,0],c);
 quad([[x,y,z+d],[x,y,z],[x,y+h,z],[x,y+h,z+d]],[-1,0,0],c);
 quad([[x,y+h,z],[x+w,y+h,z],[x+w,y+h,z+d],[x,y+h,z+d]],[0,1,0],c);
}
function windowFace(x,y,z,w,h,c){
 quad([[x,y,z],[x+w,y,z],[x+w,y+h,z],[x,y+h,z]],[0,0,-1],c);
}

/* Deterministic city */
let seed=918273;
function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
for(let x=-48;x<=48;x+=4){
  for(let z=-105;z<18;z+=7){
    if(rnd()<.10)continue;
    const w=2.5+rnd()*2.4,d=3+rnd()*2.4,h=5+rnd()*26*(z>-25?1.25:.8);
    const bx=x+(rnd()-.5)*1.2, bz=z+(rnd()-.5)*2;
    const base=rnd();
    box(bx-w/2,0,bz-d/2,w,h,d,base<.5?[.018,.075,.13]:base<.78?[.09,.025,.14]:[.025,.12,.16]);

    for(let yy=2;yy<h-1;yy+=2.7){
      for(let xx=.45;xx<w-.3;xx+=.72){
        if(rnd()<.35)continue;
        const wc=rnd()<.58?[.10,.78,1]:rnd()<.5?[1,.05,.42]:[.55,.3,1];
        windowFace(bx-w/2+xx,yy,bz-d/2-.012,.32,.72,wc);
      }
    }
  }
}

/* Road */
box(-6,-.02,-110,12,.08,128,[.008,.012,.022]);
for(let z=-105;z<15;z+=9) box(-.12,.03,z,.24,.035,3.5,[.10,.65,.78]);

const vb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,vb);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(V),gl.STATIC_DRAW);
const nb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,nb);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(N),gl.STATIC_DRAW);
const cb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,cb);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(C),gl.STATIC_DRAW);
const ib=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ib);
gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint32Array(IDX),gl.STATIC_DRAW);

function attrib(buf,loc,size){
 gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,size,gl.FLOAT,false,0,0);
}
attrib(vb,loc.p,3);attrib(nb,loc.n,3);attrib(cb,loc.col,3);

gl.enable(gl.DEPTH_TEST);gl.enable(gl.CULL_FACE);gl.clearColor(.002,.004,.012,1);

let pos=[0,4.2,9],yaw=0,pitch=-.07;
const move={x:0,y:0},look={x:0,y:0};
function bindPad(id,state){
 const el=document.getElementById(id),knob=el.querySelector(".knob");
 let active=false,pid=null;
 function set(e){
   const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
   let dx=e.clientX-cx,dy=e.clientY-cy,max=r.width*.34,l=Math.hypot(dx,dy);
   if(l>max){dx*=max/l;dy*=max/l}
   knob.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`;
   state.x=dx/max;state.y=dy/max;
 }
 el.addEventListener("pointerdown",e=>{active=true;pid=e.pointerId;el.setPointerCapture(pid);set(e);e.preventDefault()});
 el.addEventListener("pointermove",e=>{if(active)set(e)});
 function end(){active=false;state.x=state.y=0;knob.style.transform="translate(-50%,-50%)"}
 el.addEventListener("pointerup",end);el.addEventListener("pointercancel",end);el.addEventListener("lostpointercapture",end);
}
bindPad("move",move);bindPad("look",look);

let keys={};
addEventListener("keydown",e=>keys[e.key.toLowerCase()]=1);
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=0);

function resize(){const d=Math.min(devicePixelRatio||1,2);canvas.width=innerWidth*d;canvas.height=innerHeight*d}
addEventListener("resize",resize);resize();

let last=performance.now(),frames=0,lastFPS=performance.now();
function frame(now){
 const dt=Math.min((now-last)/1000,.05);last=now;
 const speed=(keys.shift?24:10);
 const forward=-(move.y);
 const strafe=move.x;
 pos[0]+=Math.sin(yaw)*forward*speed*dt+Math.cos(yaw)*strafe*speed*dt;
 pos[2]+=Math.cos(yaw)*forward*speed*dt-Math.sin(yaw)*strafe*speed*dt;
 yaw+=look.x*2.7*dt;
 pitch+=look.y*1.9*dt;
 pitch=Math.max(-.75,Math.min(.45,pitch));

 const target=[pos[0]+Math.sin(yaw)*18,pos[1]+Math.sin(pitch)*18,pos[2]+Math.cos(yaw)*18];
 const p=persp(Math.PI/3,canvas.width/canvas.height,.08,260);
 const v=lookAt(pos,target,[0,1,0]),m=I();
 gl.viewport(0,0,canvas.width,canvas.height);
 gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
 gl.useProgram(prog);
 gl.uniformMatrix4fv(loc.mvp,false,mul(p,mul(v,m)));
 gl.uniformMatrix4fv(loc.model,false,m);
 gl.uniform3f(loc.lightPos,0,22,4);
 gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ib);
 gl.drawElements(gl.TRIANGLES,IDX.length,gl.UNSIGNED_INT,0);

 frames++;
 if(now-lastFPS>500){
   document.getElementById("stats").textContent=`WEBGL2 // ${Math.round(frames*1000/(now-lastFPS))} FPS // ${V.length/3|0} VERTICES // TOUCH ONLINE`;
   frames=0;lastFPS=now;
 }
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
}
</script>
</body>
</html>
